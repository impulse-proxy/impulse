[workspace]
members = [
    "impulse",
    "crates/contracts",
    "crates/policy",
    "crates/observability",
    "crates/config",
    "crates/utils",
    "crates/edge",
    "crates/bridge",
    "crates/transport",
    "crates/lb",
    "crates/errors",
]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1"
boring = "4.3"
base64 = "0.22"
bytes = "1.10.1"
clap = { version = "4.5.49", features = ["derive"] }
env_logger = "0.11.3"
http = "1.3.1"
http-body-util = "0.1"
httpdate = "1.0"
hyper = "1"
hyper-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "webpki-roots", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
log = "0.4.28"
quiche = { version = "0.24.6", default-features = false, features = ["boringssl-boring-crate"] }
rand = "0.8"
rustls-pki-types = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
smallvec = "1"
subtle = "2"
socket2 = { version = "0.5", features = ["all"] }
core_affinity = "0.8"
itoa = "1"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-opentelemetry = "0.29.0"
opentelemetry = "0.28.0"
opentelemetry_sdk = { version = "0.28.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28.0", features = ["grpc-tonic", "trace"] }
redis = { version = "0.27", features = ["tokio-comp"] }
pingora-cache = { version = "=0.9.0", default-features = false }
pingora-core = { version = "=0.9.0", default-features = false }
pingora-error = "=0.9.0"
pingora-http = { version = "=0.9.0", default-features = false }
pingora-load-balancing = { version = "=0.9.0", default-features = false }
pingora-proxy = { version = "=0.9.0", default-features = false, features = ["rustls", "connection_filter", "upstream_modules"] }

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
