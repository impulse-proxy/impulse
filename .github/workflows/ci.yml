name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      packaging: ${{ steps.filter.outputs.packaging }}
      test_scope: ${{ steps.packages.outputs.test_scope }}
      test_packages: ${{ steps.packages.outputs.test_packages }}
      edge_tests: ${{ steps.packages.outputs.edge_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'impulse/**'
              - 'crates/**'
              - 'config/**'
              - '.cargo/**'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'Makefile'
              - 'ci/**'
              - '.github/workflows/ci.yml'
            dependencies:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
            packaging:
              - 'packaging/**'
              - 'deploy/**'
      - name: Resolve affected test packages
        id: packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash ci/affected-packages.sh "${BASE_SHA}" "${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run production Clippy gate
        run: cargo clippy --workspace --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

  test:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
      - name: Run tests
        timeout-minutes: 20
        env:
          TEST_SCOPE: ${{ needs.changes.outputs.test_scope }}
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
        run: |
          if [[ "${TEST_SCOPE}" == "workspace" ]]; then
            cargo test --workspace --exclude impulse-edge
          elif [[ -z "${TEST_PACKAGES}" ]]; then
            echo "No regular packages selected"
          else
            read -r -a packages <<< "${TEST_PACKAGES}"
            args=()
            for package in "${packages[@]}"; do
              args+=(-p "${package}")
            done
            cargo test "${args[@]}"
          fi

  edge-tests:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.edge_tests == 'true'
    env:
      RUST_TEST_THREADS: 1
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
      - name: Run serialized edge tests
        timeout-minutes: 20
        run: cargo test -p impulse-edge

  dependency-audit:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || needs.changes.outputs.dependencies == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache cargo-audit
        id: cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1
      - name: Install cargo-audit
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      - name: Run dependency vulnerability audit
        run: cargo audit
