[package]
name = "impulse-edge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["plugins-full"]
connection-rate-limit = ["impulse-plugins/connection-rate-limit"]
api-key-auth = ["impulse-plugins/api-key-auth"]
jwt-auth = ["impulse-plugins/jwt-auth"]
external-auth = ["impulse-plugins/external-auth"]
scoped-rate-limit = ["impulse-plugins/scoped-rate-limit"]
quota = ["impulse-plugins/quota"]
response-cache = ["impulse-plugins/response-cache"]
response-compression = ["impulse-plugins/response-compression"]
plugins-full = [
    "connection-rate-limit",
    "api-key-auth",
    "jwt-auth",
    "external-auth",
    "scoped-rate-limit",
    "quota",
    "response-cache",
    "response-compression",
]
plugins-minimal = ["connection-rate-limit"]

[dependencies]
async-trait.workspace = true
boring.workspace = true
base64.workspace = true
log.workspace = true
libc.workspace = true
quiche.workspace = true
impulse-config = { path = "../config" }
impulse-contracts = { path = "../contracts" }
impulse-runtime = { path = "../runtime" }
impulse-policy = { path = "../policy" }
impulse-plugins = { path = "../plugins", default-features = false }
impulse-observability = { path = "../observability" }
impulse-operations = { path = "../operations" }
impulse-http3-ingress = { path = "../http3-ingress" }
impulse-pingora-ingress = { path = "../pingora-ingress" }
impulse-lb = { path = "../lb" }
impulse-bridge = { path = "../bridge" }
impulse-transport = { path = "../transport" }
impulse-errors = { path = "../errors" }
impulse-utils = { path = "../utils" }
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls.workspace = true
tokio.workspace = true
rand.workspace = true
sha2 = "0.10"
hex = "0.4"
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
x509-parser = "0.16"
smallvec.workspace = true
pingora-cache.workspace = true
pingora-core.workspace = true
pingora-http.workspace = true
pingora-proxy.workspace = true

[[test]]
name = "regression"
path = "tests/regression/main.rs"

[[bench]]
name = "route_index"
harness = false

[dev-dependencies]
criterion = "0.5"
hmac = "0.12"
rcgen = "0.12"
serial_test = "3"
tempfile = "3"
serde_yaml.workspace = true
tokio-rustls.workspace = true
