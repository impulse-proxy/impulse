[package]
name = "impulse-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["plugins-full"]
connection-rate-limit = []
api-key-auth = ["dep:impulse-policy"]
jwt-auth = []
external-auth = []
scoped-rate-limit = ["dep:impulse-policy", "dep:sha2"]
quota = ["dep:impulse-policy"]
response-cache = ["dep:http", "dep:impulse-policy"]
response-compression = ["dep:http", "dep:impulse-policy"]
plugins-full = [
    "connection-rate-limit",
    "api-key-auth",
    "jwt-auth",
    "external-auth",
    "scoped-rate-limit",
    "quota",
    "response-cache",
    "response-compression",
]
plugins-minimal = ["connection-rate-limit"]

[dependencies]
http = { workspace = true, optional = true }
impulse-contracts = { path = "../contracts" }
impulse-policy = { path = "../policy", optional = true }
sha2 = { version = "0.10", optional = true }
